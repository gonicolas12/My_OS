# Réglages d'Ollama pour My_OS (service système du paquet `ollama`).
# Sur une Arch existante, copier ce fichier dans /etc/systemd/system/ollama.service.d/
# puis : sudo systemctl daemon-reload && sudo systemctl restart ollama
# (cf. docs/INSTALLATION.md §2.3).
[Service]
# Contexte du modèle (cache K/V) en 8 bits au lieu de 16 : deux fois moins de
# mémoire, mêmes outils choisis (comparé en VM sur Ollama 0.40.6). Exige la
# flash attention, que llama.cpp active seul dans ce cas : ne pas poser
# OLLAMA_FLASH_ATTENTION=0 à côté, le modèle ne se chargerait plus. Réglage
# global : il vaut pour tous les modèles servis par cet Ollama.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Ollama en local seul. Sans cela, il contacte ollama.com au démarrage puis toutes
# les 4 h (recommandations de modèles, cache des modèles cloud). Télécharger un
# modèle (`ollama pull`) reste possible ; seuls les modèles cloud et la recherche
# web d'Ollama, que My_OS n'utilise pas, sont coupés.
Environment="OLLAMA_NO_CLOUD=1"
