# Configuration de My_OS — défauts versionnés.
#
# Pour des réglages PERSONNELS (propres à votre machine, ex. backend: ollama),
# créez un fichier config.local.yaml à la racine : il surcharge ce fichier et
# n'est PAS versionné (cf. .gitignore). Évite les conflits git à chaque pull.
# Exemple de config.local.yaml :
#     model:
#       backend: ollama
#
# Le chemin de la socket IPC n'est volontairement PAS configurable ici : il est
# calculé à l'exécution ($XDG_RUNTIME_DIR/myos.sock) pour rester cohérent entre
# le daemon et le popup (cf. docs/INTERFACES.md §1).
#
# Aucun secret dans ce fichier (clé API cloud -> keyring, cf. docs/SECURITY.md).

# Raccourci clavier global (syntaxe pynput : modificateurs et touches spéciales
# entre chevrons, ex. "<ctrl>+<alt>+<space>", "<ctrl>+<alt>+m").
hotkey: "<ctrl>+<alt>+<space>"

# Popup Qt.
ui:
  theme: dark
  width: 600
  height: 400

# Backend modèle utilisé par l'orchestrator.
#   backend: stub    -> StubRuleModel (regex FR/EN, pas besoin d'Ollama)
#   backend: ollama  -> client local Ollama avec tool calling (nécessite
#                       `ollama serve` + `ollama pull <name>` dans la VM)
#   think: raisonnement natif du modèle. false = réactif (recommandé pour un
#          assistant au raccourci) ; true = meilleure qualité mais latence ↑↑.
model:
  backend: stub
  name: qwen3.5:4b
  think: false
  # host: http://127.0.0.1:11434   # par défaut, laisser commenté
  # Modèle Claude utilisé quand une requête est routée vers le cloud (opt-in PAR
  # requête via le toggle du popup, cf. docs/INTERFACES.md §5). La CLÉ API n'est
  # JAMAIS ici : elle se saisit dans le popup et vit dans le trousseau (keyring).
  cloud_model: claude-sonnet-4-6
